<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 360" width="100%" height="360" fill="none">
  <defs>
    <style>
      .hdr-title { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; letter-spacing: 1.5px; fill: #8b949e; font-weight: 600; }
      .col-header { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; letter-spacing: 1px; fill: #58a6ff; font-weight: 600; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #f0f6fc; }
      .box-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; fill: #8b949e; }
      .box-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; fill: #7d8590; }
      .flow-cyan { stroke: #388bfd; stroke-width: 1.5; stroke-dasharray: 5 4; animation: flowAnim 1.6s linear infinite; }
      .flow-amber { stroke: #d29922; stroke-width: 1.5; stroke-dasharray: 5 4; animation: flowAnim 1.6s linear infinite; }
      .flow-emerald { stroke: #2ea043; stroke-width: 1.5; stroke-dasharray: 5 4; animation: flowAnim 1.6s linear infinite; }
      .flow-purple { stroke: #a371f7; stroke-width: 1.5; stroke-dasharray: 5 4; animation: flowAnim 1.6s linear infinite; }
      @keyframes flowAnim { to { stroke-dashoffset: -18; } }
      .bg-card { fill: #161b22; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#388bfd" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2ea043" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d29922" />
    </marker>
  </defs>

  <!-- Outer Canvas -->
  <rect x="0.5" y="0.5" width="849" height="359" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1" />

  <!-- Diagram Header -->
  <text x="24" y="28" class="hdr-title">SYSTEM ARCHITECTURE &amp; DATA TOPOLOGY</text>
  <line x1="24" y1="40" x2="826" y2="40" stroke="#21262d" stroke-width="1" />

  <!-- Column Headers -->
  <text x="24" y="62" class="col-header">01 · EDGE &amp; DEVICES</text>
  <text x="236" y="62" class="col-header">02 · INGESTION &amp; GATEWAYS</text>
  <text x="462" y="62" class="col-header">03 · PLATFORMS &amp; SERVICES</text>
  <text x="696" y="62" class="col-header">04 · STORAGE</text>

  <!-- Flow Lines (Behind Cards) -->
  <!-- Box 1A -> Box 2A -->
  <path d="M 194 117 L 236 117" class="flow-amber" marker-end="url(#arrow-amber)" />
  <!-- Box 2A -> Box 3A -->
  <path d="M 416 117 L 462 117" class="flow-cyan" marker-end="url(#arrow-blue)" />
  <!-- Box 3A -> Box 4A -->
  <path d="M 648 117 L 696 130" class="flow-cyan" marker-end="url(#arrow-blue)" />

  <!-- Box 1B -> Box 2B -->
  <path d="M 194 235 L 236 235" class="flow-purple" />
  <!-- Box 2B -> Box 3B -->
  <path d="M 416 235 L 462 215" class="flow-emerald" marker-end="url(#arrow-emerald)" />
  <!-- Box 3B -> Box 4A -->
  <path d="M 648 215 L 696 150" class="flow-cyan" marker-end="url(#arrow-blue)" />

  <!-- Box 1B -> Box 3C -->
  <path d="M 194 250 C 310 250, 360 295, 462 295" class="flow-emerald" marker-end="url(#arrow-emerald)" />
  <!-- Box 3C -> Box 4B -->
  <path d="M 648 295 L 696 265" class="flow-emerald" marker-end="url(#arrow-emerald)" />

  <!-- COLUMN 1: EDGE & DEVICES -->
  <!-- Box 1A -->
  <rect x="24" y="80" width="170" height="74" rx="6" class="bg-card" stroke="#f85149" stroke-width="1.2" />
  <text x="36" y="103" class="box-title">Fleet MDVR Cameras</text>
  <text x="36" y="122" class="box-sub">Dual-Cam Road &amp; Cabin</text>
  <text x="36" y="141" class="box-tag">~15 FPS MJPEG / GPS Feed</text>

  <!-- Box 1B -->
  <rect x="24" y="198" width="170" height="74" rx="6" class="bg-card" stroke="#388bfd" stroke-width="1.2" />
  <text x="36" y="221" class="box-title">Edge IoT Hardware</text>
  <text x="36" y="240" class="box-sub">ESP32 &amp; Arduino Uno</text>
  <text x="36" y="259" class="box-tag">DHT11 · Soil · RFID MFRC522</text>

  <!-- COLUMN 2: INGESTION & GATEWAYS -->
  <!-- Box 2A -->
  <rect x="236" y="80" width="180" height="74" rx="6" class="bg-card" stroke="#d29922" stroke-width="1.2" />
  <text x="248" y="103" class="box-title">CMSV6 Cloud Gateway</text>
  <text x="248" y="122" class="box-sub">Active Telematics Stream</text>
  <text x="248" y="141" class="box-tag">GPS Traces &amp; ADAS/DMS Events</text>

  <!-- Box 2B -->
  <rect x="236" y="198" width="180" height="74" rx="6" class="bg-card" stroke="#bc8cff" stroke-width="1.2" />
  <text x="248" y="221" class="box-title">Payment &amp; Escrow API</text>
  <text x="248" y="240" class="box-sub">Midtrans Snap &amp; Iris</text>
  <text x="248" y="259" class="box-tag">QRIS Ingestion &amp; Payout Hook</text>

  <!-- COLUMN 3: PLATFORMS & SERVICES -->
  <!-- Box 3A -->
  <rect x="462" y="80" width="186" height="74" rx="6" class="bg-card" stroke="#388bfd" stroke-width="1.2" />
  <text x="474" y="103" class="box-title">HPU Smart Fleet</text>
  <text x="474" y="122" class="box-sub">Laravel 13 + Inertia React</text>
  <text x="474" y="141" class="box-tag">CCTV Streaming &amp; Event Center</text>

  <!-- Box 3B -->
  <rect x="462" y="180" width="186" height="64" rx="6" class="bg-card" stroke="#2ea043" stroke-width="1.2" />
  <text x="474" y="202" class="box-title">cuan.in Platform</text>
  <text x="474" y="220" class="box-sub">Node.js Express Backend</text>
  <text x="474" y="234" class="box-tag">Multi-Tenant Escrow Gateway</text>

  <!-- Box 3C -->
  <rect x="462" y="260" width="186" height="64" rx="6" class="bg-card" stroke="#2ea043" stroke-width="1.2" />
  <text x="474" y="282" class="box-title">GrowMatic Controller</text>
  <text x="474" y="300" class="box-sub">Smart Farming Automation</text>
  <text x="474" y="314" class="box-tag">Microclimate Sensor Relays</text>

  <!-- COLUMN 4: STORAGE -->
  <!-- Box 4A -->
  <rect x="696" y="95" width="130" height="80" rx="6" class="bg-card" stroke="#bc8cff" stroke-width="1.2" />
  <text x="708" y="122" class="box-title">PostgreSQL</text>
  <text x="708" y="143" class="box-sub">Relational &amp; Logs</text>
  <text x="708" y="160" class="box-tag">Hauling &amp; Escrow DB</text>

  <!-- Box 4B -->
  <rect x="696" y="215" width="130" height="80" rx="6" class="bg-card" stroke="#bc8cff" stroke-width="1.2" />
  <text x="708" y="242" class="box-title">MySQL</text>
  <text x="708" y="263" class="box-sub">Environment DB</text>
  <text x="708" y="280" class="box-tag">Sensor Telemetry</text>
</svg>
