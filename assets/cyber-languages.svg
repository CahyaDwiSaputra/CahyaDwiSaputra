<svg xmlns="http://www.w3.org/2000/svg" width="880" height="175" viewBox="0 0 880 175" role="img">
<style>
@font-face{font-family:'JBM';font-weight:400;src:local('JetBrains Mono'),local('Consolas'),monospace}
text{font-family:'JBM',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px}
.dim{fill:#8b949e}.cy{fill:#00d9ff}.fg{fill:#c9d1d9}.gr{fill:#3fb950}.wh{fill:#f0fbff}
@keyframes fadein{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.ln{animation:fadein .35s ease-out both}
.bar-grow{animation:growX 1.2s cubic-bezier(0.16,1,0.3,1) forwards;transform-origin:left}
@keyframes growX{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#00d9ff" stroke-opacity=".06"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="g" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="3"/></filter>
<clipPath id="cyberBarClip">
  <rect x="52" y="85" width="776" height="12" rx="3"/>
</clipPath>
</defs>
<path d="M16 -30V205M864 -30V205" fill="none" stroke="#00d9ff" stroke-width="3" opacity=".55" filter="url(#glow)"/>
<rect x="16" y="0" width="848" height="175" fill="#03040a"/>
<rect x="16" y="0" width="848" height="175" fill="url(#grid)"/>

<!-- Section Title -->
<text x="52" y="38" font-weight="700" fill="#00d9ff" filter="url(#g)" opacity=".8" style="font-size:18px">~/</text>
<text x="52" y="38" font-weight="700" style="font-size:18px"><tspan class="cy">~/</tspan><tspan class="wh">codebase-telemetry</tspan></text>
<text x="828" y="38" text-anchor="end" letter-spacing="1" fill="#6e7681" style="font-size:11px">// 21 REPOSITORIES INDEXED</text>
<line x1="52" y1="48" x2="828" y2="48" stroke="#00d9ff" stroke-opacity=".3"/>
<line x1="52" y1="48" x2="260" y2="48" stroke="#00d9ff" stroke-width="2"/>

<!-- Command Prompt line -->
<g class="ln" style="animation-delay:.15s"><text x="52" y="72" class="dim"><tspan class="gr">$</tspan> inspect --source-volume --percentage</text></g>

<!-- Segmented Bar (total width = 776) -->
<!-- TypeScript 56.2% = 436.1 | JS 14.7% = 114.1 | HTML 12.3% = 95.4 | PHP 6.8% = 52.8 | Python 6.2% = 48.1 | CSS 2.0% = 15.5 | Other 1.8% = 14.0 -->
<g clip-path="url(#cyberBarClip)" class="bar-grow">
  <rect x="52" y="85" width="436.1" height="12" fill="#00d9ff"/>
  <rect x="488.1" y="85" width="114.1" height="12" fill="#ffd000"/>
  <rect x="602.2" y="85" width="95.4" height="12" fill="#ff5c38"/>
  <rect x="697.6" y="85" width="52.8" height="12" fill="#777bb4"/>
  <rect x="750.4" y="85" width="48.1" height="12" fill="#3fb950"/>
  <rect x="798.5" y="85" width="15.5" height="12" fill="#d2a8ff"/>
  <rect x="814.0" y="85" width="14.0" height="12" fill="#6e7681"/>
</g>

<!-- Legend -->
<g class="ln" style="animation-delay:.35s" transform="translate(52, 128)">
  <circle cx="5" cy="5" r="4" fill="#00d9ff"/>
  <text x="14" y="9" class="fg" style="font-size:11.5px">TypeScript <tspan class="dim">56.2%</tspan></text>

  <circle cx="155" cy="5" r="4" fill="#ffd000"/>
  <text x="164" y="9" class="fg" style="font-size:11.5px">JavaScript <tspan class="dim">14.7%</tspan></text>

  <circle cx="305" cy="5" r="4" fill="#ff5c38"/>
  <text x="314" y="9" class="fg" style="font-size:11.5px">HTML <tspan class="dim">12.3%</tspan></text>

  <circle cx="430" cy="5" r="4" fill="#777bb4"/>
  <text x="439" y="9" class="fg" style="font-size:11.5px">PHP <tspan class="dim">6.8%</tspan></text>

  <circle cx="530" cy="5" r="4" fill="#3fb950"/>
  <text x="539" y="9" class="fg" style="font-size:11.5px">Python <tspan class="dim">6.2%</tspan></text>

  <circle cx="645" cy="5" r="4" fill="#6e7681"/>
  <text x="654" y="9" class="fg" style="font-size:11.5px">C++ &amp; Others <tspan class="dim">3.8%</tspan></text>
</g>

<path d="M16 0V175M864 0V175" fill="none" stroke="#00d9ff" stroke-width="1.2"/>
</svg>
