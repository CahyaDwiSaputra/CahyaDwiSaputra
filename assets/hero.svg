<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 160" width="100%" height="160" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#388bfd" stop-opacity="0" />
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="auraGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#238636" stop-opacity="0.08" />
    </linearGradient>

    <style>
      .mono-kicker {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 11px;
        letter-spacing: 2px;
        fill: #7d8590;
        font-weight: 600;
      }
      .hero-name {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
        font-size: 32px;
        font-weight: 700;
        letter-spacing: -0.5px;
        fill: #f0f6fc;
      }
      .hero-role {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
        font-size: 14.5px;
        font-weight: 500;
        fill: #58a6ff;
      }
      .hero-meta {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
        font-size: 12.5px;
        fill: #8b949e;
      }
      .badge-label {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.8px;
        fill: #3fb950;
      }
      
      /* Subtle scanning top line */
      .top-line {
        stroke-dasharray: 240, 610;
        animation: beamMove 6s linear infinite;
      }
      @keyframes beamMove {
        0% { stroke-dashoffset: 850; }
        100% { stroke-dashoffset: -850; }
      }

      /* Live status pulse */
      .pulse-dot {
        animation: livePulse 2.2s ease-in-out infinite;
      }
      @keyframes livePulse {
        0%, 100% { r: 3.5; opacity: 1; }
        50% { r: 6.5; opacity: 0.35; }
      }

      /* Subtle geometric grid */
      .grid-line { stroke: #21262d; stroke-width: 0.75; opacity: 0.4; }
    </style>
  </defs>

  <!-- Container -->
  <rect x="0.5" y="0.5" width="849" height="159" rx="10" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1" />
  <rect x="1" y="1" width="848" height="158" rx="9" fill="url(#auraGlow)" />

  <!-- Animated Top Border Line -->
  <line x1="1" y1="1" x2="849" y2="1" stroke="url(#beamGrad)" stroke-width="2" class="top-line" />

  <!-- Subtle Minimalist Grid in Top Right -->
  <line x1="620" y1="30" x2="810" y2="30" class="grid-line" />
  <line x1="620" y1="65" x2="810" y2="65" class="grid-line" />
  <line x1="620" y1="100" x2="810" y2="100" class="grid-line" />
  <line x1="620" y1="135" x2="810" y2="135" class="grid-line" />
  <line x1="660" y1="20" x2="660" y2="145" class="grid-line" />
  <line x1="710" y1="20" x2="710" y2="145" class="grid-line" />
  <line x1="760" y1="20" x2="760" y2="145" class="grid-line" />

  <!-- Left Content -->
  <text x="36" y="40" class="mono-kicker">ENGINEERING &amp; ARCHITECTURE</text>
  <text x="36" y="78" class="hero-name">Cahya Dwi Saputra</text>
  <text x="36" y="108" class="hero-role">Fullstack Web Platforms · Fleet Telematics · Embedded IoT Systems</text>
  <text x="36" y="133" class="hero-meta">Informatics @ Universitas Sebelas Maret (UNS) · Surakarta, Indonesia</text>

  <!-- Right Status Capsule -->
  <g transform="translate(635, 42)">
    <rect width="175" height="28" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <circle cx="15" cy="14" r="3.5" fill="#3fb950" class="pulse-dot" />
    <text x="28" y="18" class="badge-label">OPEN TO PROJECTS</text>
  </g>
</svg>
