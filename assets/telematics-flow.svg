<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="100%" height="250" fill="none">
  <defs>
    <style>
      .diag-header {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.5px;
        fill: #58a6ff;
      }
      .col-title {
        font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, monospace;
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 1px;
        fill: #8b949e;
      }
      .node-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 12px;
        font-weight: 600;
        fill: #f0f6fc;
      }
      .node-desc {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 10px;
        fill: #8b949e;
      }
      .arrow {
        stroke: #388bfd;
        stroke-width: 1.5;
        stroke-dasharray: 4, 3;
      }
    </style>
    <marker id="arrowHead" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0,0 L 6,3 L 0,6 Z" fill="#388bfd" />
    </marker>
  </defs>

  <!-- Container -->
  <rect x="0.5" y="0.5" width="849" height="249" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" />

  <!-- Diagram Title Bar -->
  <path d="M 1 8 C 1 4, 4 1, 8 1 L 842 1 C 846 1, 849 4, 849 8 L 849 32 L 1 32 Z" fill="#161b22" />
  <circle cx="20" cy="16" r="4" fill="#f85149" />
  <circle cx="34" cy="16" r="4" fill="#e3b341" />
  <circle cx="48" cy="16" r="4" fill="#2ea043" />
  <text x="70" y="20" class="diag-header">SYSTEM ARCHITECTURE: HPU FLEET TELEMATICS &amp; DUAL-CHANNEL CCTV STREAMING</text>

  <!-- 4 Architecture Columns -->

  <!-- Column 1: Edge Telematics -->
  <text x="24" y="54" class="col-title">1. EDGE HARDWARE</text>
  <rect x="24" y="64" width="170" height="72" rx="6" fill="#161b22" stroke="#30363d" />
  <text x="36" y="86" class="node-title">Mining MDVR &amp; GPS</text>
  <text x="36" y="103" class="node-desc">Dual Cameras (Road &amp; Cabin)</text>
  <text x="36" y="118" class="node-desc">Speed &amp; Satellite Coordinates</text>

  <rect x="24" y="146" width="170" height="68" rx="6" fill="#161b22" stroke="#30363d" />
  <text x="36" y="168" class="node-title">ADAS &amp; DMS Sensors</text>
  <text x="36" y="185" class="node-desc">G-Sensor Shock &amp; Collision</text>
  <text x="36" y="200" class="node-desc">Fatigue &amp; Distraction Alerts</text>

  <!-- Flow Arrow 1 -> 2 -->
  <line x1="194" y1="100" x2="228" y2="100" class="arrow" marker-end="url(#arrowHead)" />
  <line x1="194" y1="180" x2="228" y2="180" class="arrow" marker-end="url(#arrowHead)" />

  <!-- Column 2: Ingestion Gateway -->
  <text x="234" y="54" class="col-title">2. TELEMATICS GATEWAY</text>
  <rect x="234" y="64" width="170" height="72" rx="6" fill="#161b22" stroke="#1f6feb" stroke-width="1.2" />
  <text x="246" y="86" class="node-title">CMSV6 Media Server</text>
  <text x="246" y="103" class="node-desc">TCP / HTTP Active Gateway</text>
  <text x="246" y="118" class="node-desc">Low-Latency Video Stream</text>

  <rect x="234" y="146" width="170" height="68" rx="6" fill="#161b22" stroke="#30363d" />
  <text x="246" y="168" class="node-title">Alarm Center Hub</text>
  <text x="246" y="185" class="node-desc">Event Buffer Synchronization</text>
  <text x="246" y="200" class="node-desc">Device Online/Offline Status</text>

  <!-- Flow Arrow 2 -> 3 -->
  <line x1="404" y1="100" x2="438" y2="100" class="arrow" marker-end="url(#arrowHead)" />
  <line x1="404" y1="180" x2="438" y2="180" class="arrow" marker-end="url(#arrowHead)" />

  <!-- Column 3: Processing Backend -->
  <text x="444" y="54" class="col-title">3. PLATFORM CORE</text>
  <rect x="444" y="64" width="170" height="72" rx="6" fill="#161b22" stroke="#30363d" />
  <text x="456" y="86" class="node-title">Laravel 13 Worker</text>
  <text x="456" y="103" class="node-desc">Continuous Status Ingestion</text>
  <text x="456" y="118" class="node-desc">Automated Fault Recovery</text>

  <rect x="444" y="146" width="170" height="68" rx="6" fill="#161b22" stroke="#30363d" />
  <text x="456" y="168" class="node-title">PostgreSQL Store</text>
  <text x="456" y="185" class="node-desc">Haul Road Geo-Coordinates</text>
  <text x="456" y="200" class="node-desc">Chronological Event Logs</text>

  <!-- Flow Arrow 3 -> 4 -->
  <line x1="614" y1="100" x2="648" y2="100" class="arrow" marker-end="url(#arrowHead)" />
  <line x1="614" y1="180" x2="648" y2="180" class="arrow" marker-end="url(#arrowHead)" />

  <!-- Column 4: Command Center -->
  <text x="654" y="54" class="col-title">4. COMMAND DASHBOARD</text>
  <rect x="654" y="64" width="172" height="72" rx="6" fill="#161b22" stroke="#238636" stroke-width="1.2" />
  <text x="666" y="86" class="node-title">Dual Livecam Viewer</text>
  <text x="666" y="103" class="node-desc">Real-time Cabin &amp; Front Feed</text>
  <text x="666" y="118" class="node-desc">Low Overhead Video Display</text>

  <rect x="654" y="146" width="172" height="68" rx="6" fill="#161b22" stroke="#30363d" />
  <text x="666" y="168" class="node-title">Map &amp; Fleet Monitor</text>
  <text x="666" y="185" class="node-desc">Interactive Haul Route STA</text>
  <text x="666" y="200" class="node-desc">Instant Critical Alarm Banner</text>
</svg>
