<g class="ln" style="animation-delay:.65s">
  <text x="52" y="282" class="dim" style="font-size:12px">infra/db</text>
  <text x="135" y="282" class="cy" style="font-size:12px">›</text>

  <rect x="150" y="266" width="98" height="24" rx="2" fill="#00d9ff" fill-opacity=".06" stroke="#00d9ff" stroke-opacity=".5"/>
  <text x="160" y="282" font-weight="600" class="cy" style="font-size:11.5px">PostgreSQL</text>

  <rect x="256" y="266" width="62" height="24" rx="2" fill="#00d9ff" fill-opacity=".06" stroke="#00d9ff" stroke-opacity=".5"/>
  <text x="266" y="282" font-weight="600" class="cy" style="font-size:11.5px">MySQL</text>

  <rect x="326" y="266" width="66" height="24" rx="2" fill="#00d9ff" fill-opacity=".06" stroke="#00d9ff" stroke-opacity=".5"/>
  <text x="336" y="282" font-weight="600" class="cy" style="font-size:11.5px">Docker</text>

  <rect x="400" y="266" width="56" height="24" rx="2" fill="#00d9ff" fill-opacity=".06" stroke="#00d9ff" stroke-opacity=".5"/>
  <text x="410" y="282" font-weight="600" class="cy" style="font-size:11.5px">Linux</text>

  <rect x="464" y="266" width="46" height="24" rx="2" fill="#00d9ff" fill-opacity=".06" stroke="#00d9ff" stroke-opacity=".5"/>
  <text x="474" y="282" font-weight="600" class="cy" style="font-size:11.5px">Git</text>

  <rect x="518" y="266" width="76" height="24" rx="2" fill="#00d9ff" fill-opacity=".06" stroke="#00d9ff" stroke-opacity=".5"/>
  <text x="528" y="282" font-weight="600" class="cy" style="font-size:11.5px">Postman</text>
