  <text x="160" y="242" font-weight="600" class="cy" style="font-size:11.5px">CMSV6 Gateway</text>

  <rect x="288" y="226" width="60" height="24" rx="2" fill="#00d9ff" fill-opacity=".06" stroke="#00d9ff" stroke-opacity=".5"/>
  <text x="298" y="242" font-weight="600" class="cy" style="font-size:11.5px">ESP32</text>

  <rect x="356" y="226" width="102" height="24" rx="2" fill="#00d9ff" fill-opacity=".06" stroke="#00d9ff" stroke-opacity=".5"/>
  <text x="366" y="242" font-weight="600" class="cy" style="font-size:11.5px">Arduino Uno</text>

  <rect x="466" y="226" width="124" height="24" rx="2" fill="#00d9ff" fill-opacity=".06" stroke="#00d9ff" stroke-opacity=".5"/>
