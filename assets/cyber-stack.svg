  <rect x="416" y="146" width="84" height="24" rx="2" fill="#00d9ff" fill-opacity=".06" stroke="#00d9ff" stroke-opacity=".5"/>
  <text x="426" y="162" font-weight="600" class="cy" style="font-size:11.5px">REST APIs</text>

  <rect x="508" y="146" width="94" height="24" rx="2" fill="#00d9ff" fill-opacity=".06" stroke="#00d9ff" stroke-opacity=".5"/>
  <text x="518" y="162" font-weight="600" class="cy" style="font-size:11.5px">WebSockets</text>
</g>

<!-- Category 3: Frontend -->
<g class="ln" style="animation-delay:.45s">
  <text x="52" y="202" class="dim" style="font-size:12px">frontend</text>
  <text x="135" y="202" class="cy" style="font-size:12px">›</text>

  <rect x="150" y="186" width="78" height="24" rx="2" fill="#00d9ff" fill-opacity=".06" stroke="#00d9ff" stroke-opacity=".5"/>
  <text x="160" y="202" font-weight="600" class="cy" style="font-size:11.5px">React 19</text>

  <rect x="236" y="186" width="74" height="24" rx="2" fill="#00d9ff" fill-opacity=".06" stroke="#00d9ff" stroke-opacity=".5"/>
  <text x="246" y="202" font-weight="600" class="cy" style="font-size:11.5px">Next.js</text>

