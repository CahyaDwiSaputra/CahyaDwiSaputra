  <text x="160" y="162" font-weight="600" class="cy" style="font-size:11.5px">Laravel 13</text>

  <rect x="250" y="146" width="76" height="24" rx="2" fill="#00d9ff" fill-opacity=".06" stroke="#00d9ff" stroke-opacity=".5"/>
