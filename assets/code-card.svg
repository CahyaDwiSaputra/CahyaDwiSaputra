<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="100%" height="250" fill="none">
  <defs>
    <style>
      .code-line {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        font-size: 13px;
        line-height: 22px;
      }
      .line-num { fill: #484f58; font-weight: 500; }
      .kw { fill: #ff7b72; font-weight: 600; }      /* Keywords: const, export, import */
      .type { fill: #79c0ff; }                      /* Types: Developer */
      .var { fill: #d2a8ff; }                       /* Identifiers / Object keys */
      .str { fill: #a5d6ff; }                       /* Strings */
      .arr { fill: #7ee787; }                       /* Array contents */
      .punct { fill: #c9d1d9; }                     /* Braces & colons */
      .comment { fill: #8b949e; font-style: italic; }

      /* Blinking Typing Caret */
      .caret {
        animation: blinkCursor 0.9s infinite;
        fill: #58a6ff;
      }
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      /* Animated Top Border Wave */
      .card-glow {
        animation: glowFlow 6s ease-in-out infinite alternate;
      }
      @keyframes glowFlow {
        0% { stroke: #1f6feb; }
        50% { stroke: #8957e5; }
        100% { stroke: #238636; }
      }
    </style>
  </defs>

  <!-- Editor Container Frame -->
  <rect x="0.5" y="0.5" width="849" height="249" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" class="card-glow" />

  <!-- Window Chrome Header -->
  <path d="M 1 8 C 1 4, 4 1, 8 1 L 842 1 C 846 1, 849 4, 849 8 L 849 34 L 1 34 Z" fill="#161b22" />
  <line x1="1" y1="34" x2="849" y2="34" stroke="#21262d" stroke-width="1" />

  <!-- macOS Window Controls -->
  <circle cx="20" cy="17" r="5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
  <circle cx="36" cy="17" r="5" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
  <circle cx="52" cy="17" r="5" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />

  <!-- Active File Tab -->
  <rect x="76" y="6" width="130" height="28" rx="5" fill="#0d1117" stroke="#30363d" stroke-width="0.8" />
  <text x="96" y="24" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5px" fill="#c9d1d9">⚡ developer.ts</text>

  <!-- Code Body with Line Numbers & Syntax Highlighting -->
  <g transform="translate(24, 60)" class="code-line">
    <!-- Line 1 -->
    <text x="0" y="0" class="line-num">1</text>
    <text x="32" y="0">
      <tspan class="kw">import</tspan> <tspan class="punct">{</tspan> <tspan class="type">Engineer</tspan> <tspan class="punct">}</tspan> <tspan class="kw">from</tspan> <tspan class="str">"@craft/builder"</tspan><tspan class="punct">;</tspan>
    </text>

    <!-- Line 2 -->
    <text x="0" y="22" class="line-num">2</text>
    <text x="32" y="22">
      <tspan class="kw">export const</tspan> <tspan class="var">cahya</tspan><tspan class="punct">: </tspan><tspan class="type">Engineer</tspan> <tspan class="punct">= {</tspan>
    </text>

    <!-- Line 3 -->
    <text x="0" y="44" class="line-num">3</text>
    <text x="32" y="44">
      <tspan class="punct">  </tspan><tspan class="var">name</tspan><tspan class="punct">: </tspan><tspan class="str">"Cahya Dwi Saputra"</tspan><tspan class="punct">,</tspan>
    </text>

    <!-- Line 4 -->
    <text x="0" y="66" class="line-num">4</text>
    <text x="32" y="66">
      <tspan class="punct">  </tspan><tspan class="var">role</tspan><tspan class="punct">: </tspan><tspan class="str">"Software Engineer &amp; IoT Practitioner"</tspan><tspan class="punct">,</tspan>
    </text>

    <!-- Line 5 -->
    <text x="0" y="88" class="line-num">5</text>
    <text x="32" y="88">
      <tspan class="punct">  </tspan><tspan class="var">university</tspan><tspan class="punct">: </tspan><tspan class="str">"Universitas Sebelas Maret (UNS)"</tspan><tspan class="punct">,</tspan>
    </text>

    <!-- Line 6 -->
    <text x="0" y="110" class="line-num">6</text>
    <text x="32" y="110">
      <tspan class="punct">  </tspan><tspan class="var">location</tspan><tspan class="punct">: </tspan><tspan class="str">"Surakarta, Indonesia"</tspan><tspan class="punct">,</tspan>
    </text>

    <!-- Line 7 -->
    <text x="0" y="132" class="line-num">7</text>
    <text x="32" y="132">
      <tspan class="punct">  </tspan><tspan class="var">interests</tspan><tspan class="punct">: [</tspan><tspan class="arr">"Distributed Web"</tspan><tspan class="punct">, </tspan><tspan class="arr">"Embedded Hardware"</tspan><tspan class="punct">, </tspan><tspan class="arr">"Clean Code"</tspan><tspan class="punct">],</tspan>
    </text>

    <!-- Line 8 -->
    <text x="0" y="154" class="line-num">8</text>
    <text x="32" y="154">
      <tspan class="punct">  </tspan><tspan class="var">philosophy</tspan><tspan class="punct">: </tspan><tspan class="str">"Build software that works reliably under all conditions"</tspan>
    </text>

    <!-- Line 9 -->
    <text x="0" y="176" class="line-num">9</text>
    <text x="32" y="176">
      <tspan class="punct">};</tspan>
    </text>
    <rect x="54" y="163" width="8" height="15" class="caret" />
  </g>
</svg>
