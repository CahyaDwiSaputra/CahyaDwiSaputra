<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 155" width="100%" height="155" fill="none">
  <defs>
    <style>
      .card-bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; rx: 8; }
      .title-mono {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 11px;
        letter-spacing: 1.5px;
        fill: #58a6ff;
        font-weight: 700;
      }
      .sub-meta {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 12px;
        fill: #8b949e;
      }
      .lang-lbl {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 11.5px;
        fill: #c9d1d9;
        font-weight: 500;
      }
      .lang-pct {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 11px;
        fill: #7d8590;
      }
      .bar-anim {
        animation: growBar 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        transform-origin: left;
      }
      @keyframes growBar {
        0% { transform: scaleX(0); }
        100% { transform: scaleX(1); }
      }
    </style>

    <clipPath id="barClip">
      <rect x="26" y="58" width="798" height="12" rx="6" />
    </clipPath>
  </defs>

  <!-- Container -->
  <rect x="0.5" y="0.5" width="849" height="154" class="card-bg" />

  <!-- Title & Meta Header -->
  <text x="26" y="30" class="title-mono">CODEBASE LANGUAGE DISTRIBUTION</text>
  <text x="26" y="46" class="sub-meta">Aggregated byte count across public production repositories</text>

  <!-- Segmented Progress Bar -->
  <g clip-path="url(#barClip)" class="bar-anim">
    <!-- TypeScript: 56.2% (w=448.5, x=26) -->
    <rect x="26" y="58" width="448.5" height="12" fill="#3178c6" />
    <!-- JavaScript: 14.7% (w=117.3, x=474.5) -->
    <rect x="474.5" y="58" width="117.3" height="12" fill="#f7df1e" />
    <!-- HTML: 12.3% (w=98.2, x=591.8) -->
    <rect x="591.8" y="58" width="98.2" height="12" fill="#e34f26" />
    <!-- PHP: 6.8% (w=54.3, x=690.0) -->
    <rect x="690.0" y="58" width="54.3" height="12" fill="#777bb4" />
    <!-- Python: 6.2% (w=49.5, x=744.3) -->
    <rect x="744.3" y="58" width="49.5" height="12" fill="#3776ab" />
    <!-- CSS: 2.0% (w=16.0, x=793.8) -->
    <rect x="793.8" y="58" width="16.0" height="12" fill="#563d7c" />
    <!-- Other: 1.8% (w=14.2, x=809.8) -->
    <rect x="809.8" y="58" width="14.2" height="12" fill="#6e7681" />
  </g>

  <!-- Legend Items Row 1 (y=96) -->
  <g transform="translate(26, 96)">
    <!-- TypeScript -->
    <circle cx="5" cy="5" r="4.5" fill="#3178c6" />
    <text x="15" y="9" class="lang-lbl">TypeScript <tspan class="lang-pct">56.2%</tspan></text>

    <!-- JavaScript -->
    <circle cx="165" cy="5" r="4.5" fill="#f7df1e" />
    <text x="175" y="9" class="lang-lbl">JavaScript <tspan class="lang-pct">14.7%</tspan></text>

    <!-- HTML -->
    <circle cx="325" cy="5" r="4.5" fill="#e34f26" />
    <text x="335" y="9" class="lang-lbl">HTML <tspan class="lang-pct">12.3%</tspan></text>

    <!-- PHP -->
    <circle cx="455" cy="5" r="4.5" fill="#777bb4" />
    <text x="465" y="9" class="lang-lbl">PHP <tspan class="lang-pct">6.8%</tspan></text>

    <!-- Python -->
    <circle cx="565" cy="5" r="4.5" fill="#3776ab" />
    <text x="575" y="9" class="lang-lbl">Python <tspan class="lang-pct">6.2%</tspan></text>

    <!-- CSS -->
    <circle cx="685" cy="5" r="4.5" fill="#563d7c" />
    <text x="695" y="9" class="lang-lbl">CSS <tspan class="lang-pct">2.0%</tspan></text>
  </g>

  <!-- Legend Items Row 2 (y=122) -->
  <g transform="translate(26, 122)">
    <!-- Others -->
    <circle cx="5" cy="5" r="4.5" fill="#6e7681" />
    <text x="15" y="9" class="lang-lbl">Others (C++, Dart, SQL) <tspan class="lang-pct">1.8%</tspan></text>

    <!-- Data source note -->
    <text x="800" y="9" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11px" fill="#484f58">Production &amp; University Repositories</text>
  </g>
</svg>
