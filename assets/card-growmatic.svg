<svg xmlns="http://www.w3.org/2000/svg" width="430" height="180" viewBox="0 0 430 180" role="img">
<style>
@font-face { font-family: 'JBM'; font-weight: 400; src: local('JetBrains Mono'), local('Consolas'), monospace; }
text { font-family: 'JBM', -apple-system, BlinkMacSystemFont, 'Segoe UI', Consolas, monospace; }
.title { font-size: 15px; font-weight: 700; fill: #ffffff; }
.tag { font-size: 9.5px; font-weight: 600; letter-spacing: 0.8px; fill: #fbbf24; }
.desc { font-size: 11.5px; fill: #94a3b8; }
.pill { fill: #0f172a; stroke: #1e293b; stroke-width: 1; rx: 4px; }
</style>
<defs>
<linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#0e1626"/>
  <stop offset="100%" stop-color="#070b12"/>
</linearGradient>
<linearGradient id="topLine" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.85"/>
  <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.05"/>
</linearGradient>
</defs>

<!-- Card Background with subtle top accent line -->
<rect width="430" height="180" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2"/>
<path d="M 10 0 L 140 0" stroke="url(#topLine)" stroke-width="2.5" stroke-linecap="round"/>

<!-- Domain Pill Tag -->
<rect x="24" y="20" width="121.2" height="20" class="pill"/>
<circle cx="34" cy="30" r="3" fill="#fbbf24"/>
<text x="44" y="33.5" class="tag">AGRITECH · IOT</text>

<!-- External Link Arrow Icon -->
<g transform="translate(390, 20)" stroke="#64748b" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M1 11L11 1M11 1H4M11 1V8"/>
</g>

<!-- Title -->
<text x="24" y="65" class="title">GrowMatic Smart Farming</text>

<!-- Description -->
<text x="24" y="88" class="desc">Automated microclimate environment monitoring and dynamic</text>
<text x="24" y="106" class="desc">misting irrigation triggers for oyster mushroom cultivation.</text>

<!-- Stack Badges / Pills -->
<g transform="translate(24, 134)">
  <rect x="0" y="0" width="54" height="22" rx="4" fill="#111c30" stroke="#1e3a5f" stroke-width="0.8"/>
<text x="27.0" y="14.5" text-anchor="middle" fill="#93c5fd" style="font-size:10px;font-weight:600;">ESP32</text>
  <rect x="62" y="0" width="84" height="22" rx="4" fill="#111c30" stroke="#1e3a5f" stroke-width="0.8"/>
<text x="104.0" y="14.5" text-anchor="middle" fill="#93c5fd" style="font-size:10px;font-weight:600;">Arduino Uno</text>
  <rect x="154" y="0" width="54" height="22" rx="4" fill="#111c30" stroke="#1e3a5f" stroke-width="0.8"/>
<text x="181.0" y="14.5" text-anchor="middle" fill="#93c5fd" style="font-size:10px;font-weight:600;">DHT11</text>
  <rect x="216" y="0" width="58" height="22" rx="4" fill="#111c30" stroke="#1e3a5f" stroke-width="0.8"/>
<text x="245.0" y="14.5" text-anchor="middle" fill="#93c5fd" style="font-size:10px;font-weight:600;">MySQL</text>
</g>
</svg>