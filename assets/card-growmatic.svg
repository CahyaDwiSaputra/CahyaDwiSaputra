<svg xmlns="http://www.w3.org/2000/svg" width="435" height="190" viewBox="0 0 435 190" role="img">
<style>
@font-face{font-family:'JBM';font-weight:400;src:local('JetBrains Mono'),local('Consolas'),monospace}
text{font-family:'JBM',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px}
.dim{fill:#8b949e}.cy{fill:#00d9ff}.fg{fill:#c9d1d9}.gr{fill:#3fb950}.wh{fill:#f0fbff}
@keyframes fadein{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.ln{animation:fadein .35s ease-out both}
</style>
<defs>
<pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#00d9ff" stroke-opacity=".05"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
<filter id="g" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<path d="M8 -20V210" fill="none" stroke="#00d9ff" stroke-width="2.5" opacity=".45" filter="url(#glow)"/>
<rect x="8" y="0" width="422" height="190" rx="4" fill="#03040a"/>
<rect x="8" y="0" width="422" height="190" rx="4" fill="url(#grid)"/>

<g class="ln">
  <!-- Angled Sci-Fi Corner Card Box -->
  <path d="M28 10H406L420 24V178H42L28 164Z" fill="#00d9ff" fill-opacity=".03"/>
  <path d="M28 10H406L420 24V178H42L28 164Z" fill="none" stroke="#00d9ff" stroke-opacity=".35"/>
  <path d="M406 10L420 24" stroke="#00d9ff" stroke-width="2"/>

  <!-- Title & Arrow -->
  <text x="44" y="40" font-weight="700" fill="#00d9ff" filter="url(#g)" opacity=".6" style="font-size:16px">GrowMatic Smart Farming</text>
  <text x="44" y="40" font-weight="700" class="cy" style="font-size:16px">GrowMatic Smart Farming</text>
  <path d="M386 38l7-7M388 31h5v5" fill="none" stroke="#00d9ff" stroke-width="1.6"/>

  <!-- Tag Pill -->
  <rect x="44" y="52" width="218.5" height="18" rx="2" fill="none" stroke="#3fb950" stroke-opacity=".8"/>
  <text x="52" y="65" letter-spacing="0.8" fill="#3fb950" style="font-size:10px">AGRITECH IOT · MICROCLIMATE</text>

  <!-- Descriptions -->
  <text x="44" y="92" class="fg" style="font-size:12px">Oyster mushroom environmental sensor monitoring.</text>
  <text x="44" y="112" class="fg" style="font-size:12px">Dynamic misting irrigation actuation based on thresholds.</text>

  <!-- Stack line -->
  <text x="44" y="152" class="dim" style="font-size:11px">ESP32 · Arduino Uno · DHT11 · Soil Sensors · MySQL</text>
</g>
<path d="M8 0V190" fill="none" stroke="#00d9ff" stroke-width="1.2"/>
</svg>
