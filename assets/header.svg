<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="200" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0" />
      <stop offset="25%" stop-color="#58a6ff" stop-opacity="0.8" />
      <stop offset="75%" stop-color="#3fb950" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0" />
    </linearGradient>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 700; font-size: 30px; fill: #f0f6fc; }
      .tagline { font-family: 'SF Mono', Consolas, 'Fira Code', monospace; font-weight: 500; font-size: 15px; fill: #58a6ff; }
      .badge-text { font-family: 'SF Mono', Consolas, monospace; font-size: 11px; fill: #3fb950; letter-spacing: 1.5px; }
      .cursor { animation: blink 1s infinite; fill: #58a6ff; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      .ping { animation: ripple 2s infinite ease-out; }
      @keyframes ripple { 0% { r: 4; opacity: 1; stroke-width: 2; } 100% { r: 12; opacity: 0; stroke-width: 0.5; } }
      .waveform {
        stroke-dasharray: 600;
        stroke-dashoffset: 600;
        animation: flowWave 3.5s linear infinite;
      }
      @keyframes flowWave {
        0% { stroke-dashoffset: 600; opacity: 0.4; }
        50% { stroke-dashoffset: 0; opacity: 1; }
        100% { stroke-dashoffset: -600; opacity: 0.4; }
      }
      .grid-dot { fill: #21262d; opacity: 0.6; }
    </style>
  </defs>

  <!-- Card Frame -->
  <rect x="1" y="1" width="848" height="198" rx="12" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5" />

  <!-- Subtle corner accents -->
  <circle cx="700" cy="50" r="1.5" class="grid-dot" />
  <circle cx="730" cy="50" r="1.5" class="grid-dot" />
  <circle cx="760" cy="50" r="1.5" class="grid-dot" />
  <circle cx="790" cy="50" r="1.5" class="grid-dot" />
  <circle cx="700" cy="80" r="1.5" class="grid-dot" />
  <circle cx="730" cy="80" r="1.5" class="grid-dot" />
  <circle cx="760" cy="80" r="1.5" class="grid-dot" />
  <circle cx="790" cy="80" r="1.5" class="grid-dot" />

  <!-- Status Indicator -->
  <circle cx="46" cy="42" r="4" fill="#3fb950" />
  <circle cx="46" cy="42" r="8" fill="none" stroke="#3fb950" class="ping" />
  <text x="64" y="46" class="badge-text">STATUS: ACTIVE &amp; DISPATCHED • SURAKARTA, ID</text>

  <!-- Title & Identity -->
  <text x="46" y="98" class="title">Cahya Dwi Saputra</text>
  <text x="46" y="132" class="tagline">Fullstack Engineering &amp; IoT Telematics</text>

  <text x="46" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13px" fill="#8b949e">
    Informatics @ Universitas Sebelas Maret • Web Platforms, Fleet Video Streaming &amp; Edge Hardware
  </text>

  <!-- Animated Telemetry Waveform -->
  <path d="M 520,100 L 570,100 L 585,75 L 600,125 L 615,85 L 630,115 L 645,100 L 700,100 L 715,60 L 730,140 L 745,75 L 760,120 L 775,100 L 815,100"
        fill="none" stroke="url(#waveGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="waveform" />
</svg>
