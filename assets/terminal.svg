<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 270" width="100%" height="270" fill="none">
  <defs>
    <style>
      .term-bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; rx: 8; }
      .bar-bg { fill: #161b22; }
      .bar-title {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 11.5px;
        fill: #8b949e;
      }
      .code-text {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 12.5px;
        line-height: 20px;
      }
      .prompt { fill: #58a6ff; font-weight: 700; }
      .cmd { fill: #f0f6fc; }
      .dim { fill: #484f58; }
      .key { fill: #79c0ff; }
      .val { fill: #a5d6ff; }
      .hl { fill: #7ee787; font-weight: 600; }
      .hl-orange { fill: #ffa657; }
      .border-box { fill: #161b22; stroke: #21262d; stroke-width: 1; rx: 6; }
      
      .cursor {
        animation: blinkCursor 1s infinite;
        fill: #58a6ff;
      }
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Terminal Window Frame -->
  <rect x="0.5" y="0.5" width="849" height="269" class="term-bg" />

  <!-- Window Header Bar -->
  <path d="M 1 8 C 1 4, 4 1, 8 1 L 842 1 C 846 1, 849 4, 849 8 L 849 34 L 1 34 Z" class="bar-bg" />
  <line x1="1" y1="34" x2="849" y2="34" stroke="#21262d" stroke-width="1" />

  <!-- macOS Controls -->
  <circle cx="20" cy="17" r="5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
  <circle cx="36" cy="17" r="5" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
  <circle cx="52" cy="17" r="5" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />

  <!-- Title in Window Bar -->
  <text x="425" y="21" text-anchor="middle" class="bar-title">cahya@surakarta-workstation:~ (zsh)</text>

  <!-- Terminal Content -->
  <g transform="translate(24, 60)" class="code-text">
    <!-- Prompt 1 -->
    <text x="0" y="0">
      <tspan class="prompt">❯</tspan> <tspan class="cmd">cahya --profile --system-overview</tspan>
    </text>

    <!-- Inner Spec Box -->
    <rect x="0" y="14" width="802" height="135" class="border-box" />

    <text x="20" y="38">
      <tspan class="key">Developer </tspan><tspan class="dim">: </tspan><tspan class="hl">Cahya Dwi Saputra</tspan>
      <tspan class="dim"> | </tspan>
      <tspan class="key">Role </tspan><tspan class="dim">: </tspan><tspan class="val">Fullstack Engineer &amp; IoT Telematics</tspan>
    </text>

    <text x="20" y="60">
      <tspan class="key">Institution</tspan><tspan class="dim">: </tspan><tspan class="val">Informatics, Universitas Sebelas Maret (UNS)</tspan>
      <tspan class="dim"> | </tspan>
      <tspan class="key">Base</tspan><tspan class="dim">: </tspan><tspan class="val">Surakarta, ID</tspan>
    </text>

    <text x="20" y="82">
      <tspan class="key">Web Focus  </tspan><tspan class="dim">: </tspan><tspan class="val">Distributed Architecture (Laravel 13, React 19 Inertia, Node.js, PostgreSQL)</tspan>
    </text>

    <text x="20" y="104">
      <tspan class="key">Telematics </tspan><tspan class="dim">: </tspan><tspan class="hl-orange">CMSV6 Media Gateway</tspan><tspan class="val"> · Dual-Channel MDVR CCTV Streaming · ADAS/DMS Alarms</tspan>
    </text>

    <text x="20" y="126">
      <tspan class="key">Hardware   </tspan><tspan class="dim">: </tspan><tspan class="val">ESP32 &amp; Arduino Uno · Microclimate Actuation (GrowMatic) · RFID Security Lab</tspan>
    </text>

    <!-- Prompt 2 -->
    <text x="0" y="172">
      <tspan class="prompt">❯</tspan> <tspan class="cmd">systemctl status engineering-pipeline</tspan>
    </text>
    <text x="0" y="192">
      <tspan class="hl">●</tspan> <tspan class="val">pipeline.service - active (running) · 21 public repositories indexed</tspan>
      <rect x="525" y="180" width="8" height="15" class="cursor" />
    </text>
  </g>
</svg>
