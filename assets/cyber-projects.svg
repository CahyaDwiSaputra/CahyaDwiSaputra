<svg xmlns="http://www.w3.org/2000/svg" width="880" height="70" viewBox="0 0 880 70" role="img">
<style>
@font-face{font-family:'JBM';font-weight:400;src:local('JetBrains Mono'),local('Consolas'),monospace}
text{font-family:'JBM',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px}
.dim{fill:#8b949e}.cy{fill:#00d9ff}.gr{fill:#3fb950}.wh{fill:#f0fbff}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#00d9ff" stroke-opacity=".06"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="g" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<path d="M16 -20V90M864 -20V90" fill="none" stroke="#00d9ff" stroke-width="3" opacity=".55" filter="url(#glow)"/>
<rect x="16" y="0" width="848" height="70" fill="#03040a"/>
<rect x="16" y="0" width="848" height="70" fill="url(#grid)"/>

<text x="52" y="38" font-weight="700" fill="#00d9ff" filter="url(#g)" opacity=".8" style="font-size:18px">~/</text>
<text x="52" y="38" font-weight="700" style="font-size:18px"><tspan class="cy">~/</tspan><tspan class="wh">deployed-systems</tspan></text>
<text x="828" y="38" text-anchor="end" letter-spacing="1" fill="#6e7681" style="font-size:11px">// ARCHITECTURE HIGHLIGHTS</text>
<line x1="52" y1="50" x2="828" y2="50" stroke="#00d9ff" stroke-opacity=".3"/>
<line x1="52" y1="50" x2="250" y2="50" stroke="#00d9ff" stroke-width="2"/>
<path d="M16 0V70M864 0V70" fill="none" stroke="#00d9ff" stroke-width="1.2"/>
</svg>
