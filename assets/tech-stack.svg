<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="100%" height="250" fill="none">
  <defs>
    <style>
      .card-bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; rx: 8; }
      .sec-title {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 11px;
        letter-spacing: 1.5px;
        fill: #58a6ff;
        font-weight: 700;
      }
      .panel-bg { fill: #161b22; stroke: #21262d; stroke-width: 1; rx: 6; }
      .panel-head {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 12px;
        font-weight: 600;
        fill: #c9d1d9;
      }
      .pill {
        fill: #0d1117;
        stroke: #30363d;
        stroke-width: 1;
        rx: 4;
      }
      .pill-text {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 11px;
        fill: #f0f6fc;
      }
      .dot { r: 3; }
    </style>
  </defs>

  <!-- Container -->
  <rect x="0.5" y="0.5" width="849" height="249" class="card-bg" />

  <!-- Title Bar -->
  <text x="24" y="28" class="sec-title">TECHNICAL EXPERTISE &amp; ARCHITECTURAL TOOLKIT</text>
  <line x1="24" y1="38" x2="826" y2="38" stroke="#21262d" stroke-width="1" />

  <!-- 4 Grid Panels: 2 Rows x 2 Columns -->
  <!-- Col 1, Row 1: Languages (x=24, y=48, w=390, h=90) -->
  <rect x="24" y="48" width="393" height="90" class="panel-bg" />
  <text x="36" y="68" class="panel-head">Languages</text>
  
  <!-- Pills Languages -->
  <g transform="translate(36, 80)">
    <!-- TypeScript -->
    <rect x="0" y="0" width="88" height="22" class="pill" />
    <circle cx="10" cy="11" class="dot" fill="#3178c6" />
    <text x="20" y="15" class="pill-text">TypeScript</text>

    <!-- JavaScript -->
    <rect x="94" y="0" width="86" height="22" class="pill" />
    <circle cx="104" cy="11" class="dot" fill="#f7df1e" />
    <text x="114" y="15" class="pill-text">JavaScript</text>

    <!-- PHP -->
    <rect x="186" y="0" width="52" height="22" class="pill" />
    <circle cx="196" cy="11" class="dot" fill="#777bb4" />
    <text x="206" y="15" class="pill-text">PHP</text>

    <!-- Python -->
    <rect x="244" y="0" width="66" height="22" class="pill" />
    <circle cx="254" cy="11" class="dot" fill="#3776ab" />
    <text x="264" y="15" class="pill-text">Python</text>

    <!-- C++ -->
    <rect x="316" y="0" width="52" height="22" class="pill" />
    <circle cx="326" cy="11" class="dot" fill="#00599c" />
    <text x="336" y="15" class="pill-text">C++</text>

    <!-- Row 2 of Languages -->
    <!-- Dart -->
    <rect x="0" y="27" width="56" height="22" class="pill" />
    <circle cx="10" cy="38" class="dot" fill="#0175c2" />
    <text x="20" y="42" class="pill-text">Dart</text>

    <!-- SQL -->
    <rect x="62" y="27" width="54" height="22" class="pill" />
    <circle cx="72" cy="38" class="dot" fill="#e38c00" />
    <text x="82" y="42" class="pill-text">SQL</text>
  </g>

  <!-- Col 2, Row 1: Frameworks & Web (x=433, y=48, w=393, h=90) -->
  <rect x="433" y="48" width="393" height="90" class="panel-bg" />
  <text x="445" y="68" class="panel-head">Frameworks &amp; Web</text>

  <g transform="translate(445, 80)">
    <!-- Laravel -->
    <rect x="0" y="0" width="66" height="22" class="pill" />
    <circle cx="10" cy="11" class="dot" fill="#ff2d20" />
    <text x="20" y="15" class="pill-text">Laravel</text>

    <!-- React -->
    <rect x="72" y="0" width="60" height="22" class="pill" />
    <circle cx="82" cy="11" class="dot" fill="#61dafb" />
    <text x="92" y="15" class="pill-text">React</text>

    <!-- Next.js -->
    <rect x="138" y="0" width="68" height="22" class="pill" />
    <circle cx="148" cy="11" class="dot" fill="#ffffff" />
    <text x="158" y="15" class="pill-text">Next.js</text>

    <!-- Inertia.js -->
    <rect x="212" y="0" width="76" height="22" class="pill" />
    <circle cx="222" cy="11" class="dot" fill="#9553e9" />
    <text x="232" y="15" class="pill-text">Inertia.js</text>

    <!-- Node.js -->
    <rect x="294" y="0" width="72" height="22" class="pill" />
    <circle cx="304" cy="11" class="dot" fill="#339933" />
    <text x="314" y="15" class="pill-text">Node.js</text>

    <!-- Row 2 -->
    <!-- Express -->
    <rect x="0" y="27" width="70" height="22" class="pill" />
    <circle cx="10" cy="38" class="dot" fill="#cccccc" />
    <text x="20" y="42" class="pill-text">Express</text>

    <!-- Tailwind CSS -->
    <rect x="76" y="27" width="94" height="22" class="pill" />
    <circle cx="86" cy="38" class="dot" fill="#06b6d4" />
    <text x="96" y="42" class="pill-text">Tailwind</text>

    <!-- Flutter -->
    <rect x="176" y="27" width="66" height="22" class="pill" />
    <circle cx="186" cy="38" class="dot" fill="#02569b" />
    <text x="196" y="42" class="pill-text">Flutter</text>
  </g>

  <!-- Col 1, Row 2: Databases & Tools (x=24, y=148, w=393, h=90) -->
  <rect x="24" y="148" width="393" height="90" class="panel-bg" />
  <text x="36" y="168" class="panel-head">Databases &amp; DevOps</text>

  <g transform="translate(36, 180)">
    <!-- PostgreSQL -->
    <rect x="0" y="0" width="92" height="22" class="pill" />
    <circle cx="10" cy="11" class="dot" fill="#4169e1" />
    <text x="20" y="15" class="pill-text">PostgreSQL</text>

    <!-- MySQL -->
    <rect x="98" y="0" width="62" height="22" class="pill" />
    <circle cx="108" cy="11" class="dot" fill="#4479a1" />
    <text x="118" y="15" class="pill-text">MySQL</text>

    <!-- Docker -->
    <rect x="166" y="0" width="68" height="22" class="pill" />
    <circle cx="176" cy="11" class="dot" fill="#2496ed" />
    <text x="186" y="15" class="pill-text">Docker</text>

    <!-- Linux -->
    <rect x="240" y="0" width="58" height="22" class="pill" />
    <circle cx="250" cy="11" class="dot" fill="#fcc624" />
    <text x="260" y="15" class="pill-text">Linux</text>

    <!-- Git -->
    <rect x="304" y="0" width="46" height="22" class="pill" />
    <circle cx="314" cy="11" class="dot" fill="#f05032" />
    <text x="324" y="15" class="pill-text">Git</text>

    <!-- Postman -->
    <rect x="0" y="27" width="76" height="22" class="pill" />
    <circle cx="10" cy="38" class="dot" fill="#ff6c37" />
    <text x="20" y="42" class="pill-text">Postman</text>
  </g>

  <!-- Col 2, Row 2: IoT & Telematics (x=433, y=148, w=393, h=90) -->
  <rect x="433" y="148" width="393" height="90" class="panel-bg" />
  <text x="445" y="168" class="panel-head">IoT &amp; Telematics Hardware</text>

  <g transform="translate(445, 180)">
    <!-- CMSV6 Media Gateway -->
    <rect x="0" y="0" width="124" height="22" class="pill" />
    <circle cx="10" cy="11" class="dot" fill="#3fb950" />
    <text x="20" y="15" class="pill-text">CMSV6 Gateway</text>

    <!-- ESP32 -->
    <rect x="130" y="0" width="64" height="22" class="pill" />
    <circle cx="140" cy="11" class="dot" fill="#e7352c" />
    <text x="150" y="15" class="pill-text">ESP32</text>

    <!-- Arduino Uno -->
    <rect x="200" y="0" width="94" height="22" class="pill" />
    <circle cx="210" cy="11" class="dot" fill="#00979d" />
    <text x="220" y="15" class="pill-text">Arduino Uno</text>

    <!-- MQTT -->
    <rect x="300" y="0" width="60" height="22" class="pill" />
    <circle cx="310" cy="11" class="dot" fill="#660066" />
    <text x="320" y="15" class="pill-text">MQTT</text>

    <!-- Row 2 -->
    <!-- RFID MFRC522 -->
    <rect x="0" y="27" width="102" height="22" class="pill" />
    <circle cx="10" cy="38" class="dot" fill="#58a6ff" />
    <text x="20" y="42" class="pill-text">RFID MFRC522</text>

    <!-- Sensors (SPI, I2C) -->
    <rect x="108" y="27" width="138" height="22" class="pill" />
    <circle cx="118" cy="38" class="dot" fill="#d2a8ff" />
    <text x="128" y="42" class="pill-text">Sensors (SPI, I2C)</text>

    <!-- Telemetry -->
    <rect x="252" y="27" width="90" height="22" class="pill" />
    <circle cx="262" cy="38" class="dot" fill="#7ee787" />
    <text x="272" y="42" class="pill-text">Telemetry</text>
  </g>
</svg>
